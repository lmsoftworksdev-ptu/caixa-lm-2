<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animação de boot premium - LM Sound</title>
<style>
  :root { --texto: #f2f5f8; --mudo: #9aa7b5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0e12; color: var(--texto); font-family: "Segoe UI", system-ui, sans-serif; padding: 24px; }
  h1 { font-weight: 600; font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: var(--mudo); font-size: 14px; max-width: 820px; line-height: 1.5; }
  .palco { width: min(100%, 1040px); aspect-ratio: 16/9; background: #000; border: 1px solid #222a33; border-radius: 12px; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
  .barra { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; width: min(100%, 1040px); }
  button { background: #1a2029; color: var(--texto); border: 1px solid #2f3a47; border-radius: 8px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
  button:hover { background: #263241; }
  button:focus-visible { outline: 2px solid #7fe3ff; outline-offset: 2px; }
  input[type=range] { flex: 1; min-width: 200px; accent-color: #2ec4b6; }
  .info { font-size: 13px; color: var(--mudo); min-width: 150px; }
</style>
</head>
<body>
<h1>Animação de boot premium — LM Sound</h1>
<p class="sub">Horizontal 16:9. Mesmas cores da interface (azul e vermelho). Abertura de cerca de 3,4 s e depois os anéis pulsam em repetição até o app abrir. Arraste a barra para ver qualquer quadro. Todos os valores estão no topo do código.</p>

<div class="palco"><canvas id="c" width="1280" height="720" aria-label="Animação de boot: anéis de luz com a caixa de som no centro e a marca LM Sound"></canvas></div>
<div class="barra">
  <button id="rep">Reiniciar</button>
  <button id="pau">Pausar</button>
  <input type="range" id="scr" min="0" max="8" step="0.01" value="0" aria-label="Linha do tempo">
  <span class="info" id="tempo"></span>
</div>

<script>
// ---- Parâmetros ajustáveis ----
const P = {
  corFundo: '#050b1c',
  corPrata: '#c9d3dd',
  corBorda: '#2f7bff',     // azul da interface
  corBrilho: '#6aa8ff',    // azul claro da interface
  corVermelho: '#ff3b4e', // destaque vermelho da interface
  nome: 'LM SOUND',
  creditos: 'Desenvolvido por Lucas Monteiro.',
  duracaoAbertura: 3.4,    // segundos da parte que toca uma vez
  periodoLoop: 3.2,        // segundos de cada respiração na repetição
  raioAnel: 150,           // raio do anel de luz (px no quadro de 1280x720)
  graos: 0.05,             // intensidade do granulado de filme (0 = sem)
  poeira: 70               // partículas de luz flutuando
};

const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = cv.width, H = cv.height, CX = W / 2, CY = 296, TAU = Math.PI * 2;

const clamp01 = t => Math.max(0, Math.min(1, t));
const easeOut = t => 1 - Math.pow(1 - clamp01(t), 3);
const easeOutExpo = t => { t = clamp01(t); return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); };
const easeInOut = t => { t = clamp01(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const smooth = (a, b, t) => { const k = clamp01((t - a) / (b - a)); return k * k * (3 - 2 * k); };
const rnd = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// granulado de filme gerado uma vez
const gr = document.createElement('canvas'); gr.width = gr.height = 256;
(function () { const x = gr.getContext('2d'), d = x.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (Math.random() - .5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); })();

function arco(r, a0, a1, cor, lw, alpha) {
  g.globalAlpha = alpha; g.strokeStyle = cor; g.lineWidth = lw;
  g.beginPath(); g.arc(CX, CY, r, a0, a1); g.stroke();
}

// t em segundos desde o início. Função pura: o mesmo desenho gera os quadros reais depois.
function desenhar(t) {
  const D = P.duracaoAbertura;
  const tl = Math.max(0, t - D);
  const mix = smooth(0, 0.8, tl);                                  // entra no modo respiração
  const resp = 0.5 - 0.5 * Math.cos(tl / P.periodoLoop * TAU);    // 0..1 respirando
  const batida = Math.pow(Math.max(0, Math.cos(t * TAU / 1.6)), 6); // pulso suave para as marcas

  // ---------- fundo ----------
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.fillStyle = P.corFundo; g.fillRect(0, 0, W, H);
  const amb = smooth(0.2, 1.8, t) * (0.7 + 0.3 * (mix ? resp : 1));
  let rg = g.createRadialGradient(CX, CY, 20, CX, CY, 620);
  rg.addColorStop(0, `rgba(47,123,255,${0.16 * amb})`); rg.addColorStop(.45, `rgba(255,59,78,${0.05 * amb})`); rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);

  // câmera: começa um pouco mais perto e assenta devagar
  g.save(); const cam = 1 + 0.05 * (1 - easeOut(t / 3.6));
  g.translate(CX, CY); g.scale(cam, cam); g.translate(-CX, -CY);

  // ---------- poeira de luz ----------
  g.globalCompositeOperation = 'lighter';
  const pf = smooth(0.6, 1.8, t);
  for (let i = 0; i < P.poeira; i++) {
    const x = rnd(i) * W, y = ((rnd(i + 100) * H - t * (6 + rnd(i + 200) * 14)) % H + H) % H;
    const tw = 0.5 + 0.5 * Math.sin(t * (0.8 + rnd(i + 300) * 1.6) + i);
    g.globalAlpha = pf * (0.05 + 0.28 * tw) * rnd(i + 400);
    g.fillStyle = rnd(i + 500) > .5 ? P.corBrilho : '#ffffff';
    g.beginPath(); g.arc(x, y, 0.6 + rnd(i + 600) * 1.4, 0, TAU); g.fill();
  }

  // ---------- faísca inicial ----------
  if (t < 1.2) {
    const k = t / 0.9, a = t < 0.14 ? t / 0.14 : clamp01(1 - (t - 0.14) / 1.0);
    const r = 6 + 260 * easeOutExpo(k);
    rg = g.createRadialGradient(CX, CY, 0, CX, CY, r);
    rg.addColorStop(0, `rgba(255,255,255,${a})`); rg.addColorStop(.18, `rgba(106,168,255,${0.55 * a})`);
    rg.addColorStop(.5, `rgba(47,123,255,${0.14 * a})`); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalAlpha = 1; g.fillStyle = rg; g.beginPath(); g.arc(CX, CY, r, 0, TAU); g.fill();
  }

  // ---------- anel de luz que se desenha ----------
  const R = P.raioAnel, s = easeInOut((t - 0.45) / 1.25), cabeca = -Math.PI / 2 + s * TAU;
  g.shadowColor = P.corBrilho; g.shadowBlur = 22; g.lineCap = 'round';
  if (s < 1) {
    const cauda = 1.9, n = 72;
    for (let i = 0; i < n; i++) {
      const f = i / n, a0 = cabeca - cauda * (1 - f), a1 = cabeca - cauda * (1 - (f + 1 / n));
      if (a1 < -Math.PI / 2 - 0.001 && s < 1) { if (a1 < -Math.PI / 2 - cauda) continue; }
      arco(R, a0, a1 + 0.02, i > n * 0.8 ? '#ffffff' : P.corBrilho, 2 + 2.5 * f, Math.pow(f, 1.8) * 0.95);
    }
    // cabeça brilhante
    g.shadowBlur = 36; g.globalAlpha = 1; g.fillStyle = '#fff';
    g.beginPath(); g.arc(CX + Math.cos(cabeca) * R, CY + Math.sin(cabeca) * R, 4, 0, TAU); g.fill();
  }
  // aneis de borda (so linhas), que pulsam como a logo original
  const fecha = smooth(0.9, 1.7, t);
  const raios = [R + 24, R, R - 24];
  raios.forEach((rr, i) => {
    const k = easeOut((t - 1.0 - i * 0.14) / 0.7); if (k <= 0) return;
    const fase = (tl / P.periodoLoop - i * 0.12) * TAU, pulso = mix * (0.5 + 0.5 * Math.sin(fase));
    g.globalAlpha = k * (i === 1 ? 0.9 : 0.55) * (1 - 0.35 * mix + 0.35 * mix * pulso);
    g.shadowBlur = i === 1 ? 18 + 12 * pulso : 6;
    g.lineWidth = i === 1 ? 3 : 2;
    const grad = (i === 1 && g.createConicGradient) ? g.createConicGradient(tl * 0.35 - Math.PI / 2, CX, CY) : null;
    if (grad) { grad.addColorStop(0, P.corBrilho); grad.addColorStop(.3, P.corBorda); grad.addColorStop(.5, P.corBrilho); grad.addColorStop(.7, P.corBorda); grad.addColorStop(1, P.corBrilho); g.strokeStyle = grad; }
    else g.strokeStyle = i === 2 ? P.corBrilho : P.corBorda;
    g.beginPath(); g.arc(CX, CY, rr * (0.9 + 0.1 * k) * (1 + 0.02 * pulso), 0, TAU); g.stroke();
  });
  g.shadowBlur = 0;

  // ---------- ondas de choque ----------
  const ondas = [[1.55, 1.8, .36]];
  for (let c = 0; tl > 0 && c < 3; c++) { const tc = D + Math.floor(tl / P.periodoLoop) * P.periodoLoop - c * P.periodoLoop; if (tc > D - 0.01) ondas.push([tc, P.periodoLoop * 0.9, .16]); }
  ondas.forEach(([t0, dur, a]) => {
    const k = (t - t0) / dur; if (k < 0 || k > 1) return;
    g.globalAlpha = a * Math.pow(1 - k, 2); g.strokeStyle = P.corBrilho; g.lineWidth = 1.6 + 2 * (1 - k);
    g.beginPath(); g.arc(CX, CY, R + 10 + 420 * easeOut(k), 0, TAU); g.stroke();
  });

  // ---------- caixa de som (a marca) ----------
  const k2 = easeOut((t - 1.15) / 0.9), esc = (0.85 + 0.15 * k2) * (1 + 0.025 * resp * mix + 0.015 * batida * smooth(2.2, 3, t));
  if (k2 > 0) {
    g.save(); g.translate(CX, CY); g.scale(esc, esc); g.globalCompositeOperation = 'source-over'; g.globalAlpha = k2;
    const rrect = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
    // corpo
    let cg = g.createLinearGradient(0, -96, 0, 96); cg.addColorStop(0, '#16306a'); cg.addColorStop(.5, '#0c1d45'); cg.addColorStop(1, '#070f26');
    g.shadowColor = P.corBrilho; g.shadowBlur = 22 + 14 * resp * mix; rrect(-64, -92, 128, 184, 26); g.fillStyle = cg; g.fill();
    g.shadowBlur = 0; g.lineWidth = 3.5; g.strokeStyle = P.corBrilho; g.stroke();
    // brilho de vidro na quina de cima
    g.globalAlpha = k2 * 0.35; g.lineWidth = 2; g.strokeStyle = '#ffffff'; g.beginPath(); g.arc(-38, -66, 26, Math.PI * 1.05, Math.PI * 1.5); g.stroke(); g.globalAlpha = k2;
    // tweeter
    cg = g.createRadialGradient(-4, -58, 1, 0, -52, 17); cg.addColorStop(0, '#dff0ff'); cg.addColorStop(.35, P.corBrilho); cg.addColorStop(1, '#173d94');
    g.lineWidth = 3; g.strokeStyle = P.corBorda; g.beginPath(); g.arc(0, -52, 19, 0, TAU); g.stroke();
    g.fillStyle = cg; g.beginPath(); g.arc(0, -52, 9, 0, TAU); g.fill();
    // woofer: aros concentricos + cupula
    g.strokeStyle = P.corBorda; g.lineWidth = 4; g.beginPath(); g.arc(0, 26, 46, 0, TAU); g.stroke();
    g.globalAlpha = k2 * 0.65; g.lineWidth = 2.5; g.beginPath(); g.arc(0, 26, 34, 0, TAU); g.stroke();
    g.globalAlpha = k2 * 0.35; g.lineWidth = 1.6; g.beginPath(); g.arc(0, 26, 24, 0, TAU); g.stroke(); g.globalAlpha = k2;
    cg = g.createRadialGradient(-5, 20, 1, 0, 26, 15); cg.addColorStop(0, '#e8f3ff'); cg.addColorStop(.4, P.corBrilho); cg.addColorStop(1, '#1b4bb8');
    g.shadowColor = P.corBrilho; g.shadowBlur = 14 + 12 * resp * mix; g.fillStyle = cg; g.beginPath(); g.arc(0, 26, 12, 0, TAU); g.fill();
    // led vermelho de aparelho ligado
    g.shadowColor = P.corVermelho; g.shadowBlur = 10 + 10 * resp * mix; g.fillStyle = P.corVermelho; g.globalAlpha = k2 * (0.75 + 0.25 * resp * mix);
    g.beginPath(); g.arc(0, 78, 3.6, 0, TAU); g.fill();
    g.restore();
  }

  // ---------- nome ----------
  g.globalCompositeOperation = 'source-over'; g.shadowBlur = 0;
  const letras = P.nome.split(''), fs = 62, trk = 26;
  g.font = `300 ${fs}px "Segoe UI Light","Segoe UI",system-ui,sans-serif`; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  const larg = letras.map(c => g.measureText(c).width), tot = larg.reduce((a, b) => a + b, 0) + trk * (letras.length - 1);
  let x = CX - tot / 2; const yN = 632, brilhoX = (t - 2.45) / 0.9;
  letras.forEach((c, i) => {
    const k = easeOut((t - 1.9 - i * 0.07) / 0.7);
    if (c !== ' ' && k > 0) {
      const gx = g.createLinearGradient(CX - tot / 2, 0, CX + tot / 2, 0), p = clamp01(brilhoX) * 1.4 - 0.2;
      const lo = clamp01(p - 0.14), mid = clamp01(p), hi = clamp01(p + 0.14);
      gx.addColorStop(0, P.corPrilho || '#b9c4cf'); gx.addColorStop(lo, '#b9c4cf'); gx.addColorStop(mid, brilhoX > 0 && brilhoX < 1.1 ? '#ffffff' : '#b9c4cf'); gx.addColorStop(hi, '#b9c4cf'); gx.addColorStop(1, '#b9c4cf');
      g.globalAlpha = k * 0.95; g.fillStyle = gx; g.fillText(c, x, yN + 16 * (1 - k));
    }
    x += larg[i] + trk;
  });
  // crédito
  g.globalAlpha = easeOut((t - 2.6) / 0.8) * 0.5; g.fillStyle = '#9aa7b5'; g.textAlign = 'center';
  g.font = '300 19px "Segoe UI",system-ui,sans-serif'; if ('letterSpacing' in g) g.letterSpacing = '2px';
  g.fillText(P.creditos, CX, 701); if ('letterSpacing' in g) g.letterSpacing = '0px';

  g.restore();

  // ---------- acabamento: vinheta, granulado, entrada e fade de cena ----------
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  const vg = g.createRadialGradient(CX, H / 2, H * 0.3, CX, H / 2, H * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.75)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  if (P.graos > 0) {
    const o = Math.floor(t * 24) % 256; g.globalCompositeOperation = 'overlay'; g.globalAlpha = P.graos;
    for (let y = -256 + (o * 53 % 256); y < H; y += 256) for (let xx = -256 + (o * 97 % 256); xx < W; xx += 256) g.drawImage(gr, xx, y);
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  }
  const f0 = 1 - smooth(0, 0.35, t);             // sai do preto
  if (f0 > 0) { g.fillStyle = `rgba(0,0,0,${f0})`; g.fillRect(0, 0, W, H); }
}

// ---------- controle ----------
let t0 = performance.now(), parado = false, tPausa = 0;
const rotulo = document.getElementById('tempo'), scr = document.getElementById('scr'), bPau = document.getElementById('pau');
function tempoAtual() { return parado ? tPausa : (performance.now() - t0) / 1000; }
function quadro() {
  const t = tempoAtual(); desenhar(t);
  rotulo.textContent = (t < P.duracaoAbertura ? 'Abertura ' : 'Em repetição ') + t.toFixed(1) + ' s';
  if (!parado) scr.value = Math.min(8, t) ;
  requestAnimationFrame(quadro);
}
document.getElementById('rep').onclick = () => { parado = false; bPau.textContent = 'Pausar'; t0 = performance.now(); };
bPau.onclick = () => { if (parado) { parado = false; t0 = performance.now() - tPausa * 1000; bPau.textContent = 'Pausar'; } else { parado = true; tPausa = tempoAtual(); bPau.textContent = 'Continuar'; } };
scr.oninput = () => { parado = true; tPausa = +scr.value; bPau.textContent = 'Continuar'; };
requestAnimationFrame(quadro);
</script>
</body>
</html>
